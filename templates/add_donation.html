{% extends 'base.html' %}

{% block title %}Post Food Donation - FoodBridge{% endblock %}

{% block content %}
<div class="form-card">
    <div style="margin-bottom: 1.75rem;">
        <h1 style="font-size: 1.8rem; margin-bottom: 0.5rem;">Post Food Donation</h1>
        <p style="color: var(--text-muted);">Share details about your surplus food so local NGOs can arrange pickup.</p>
    </div>

    <form action="{{ url_for('add_donation') }}" method="POST">
        <div class="form-group">
            <label class="form-label" for="food_name">Food Name / Description *</label>
            <input type="text" id="food_name" name="food_name" class="form-control" 
                   placeholder="e.g. Surplus Buffet Rice & Veggie Curry" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="quantity">Quantity *</label>
                <input type="text" id="quantity" name="quantity" class="form-control" 
                       placeholder="e.g. 50 Portions / 20 kg" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="category">Category</label>
                <select id="category" name="category" class="form-control">
                    <option value="Prepared Meals">Prepared Meals</option>
                    <option value="Bakery Items">Bakery & Pastries</option>
                    <option value="Fresh Produce">Fresh Fruits & Veggies</option>
                    <option value="Packaged Foods">Packaged / Dry Goods</option>
                    <option value="Beverages">Beverages</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="expiry_time">Best Before / Expiry Time *</label>
            <input type="text" id="expiry_time" name="expiry_time" class="form-control" 
                   placeholder="e.g. Today by 10:30 PM (Prepared 2 hours ago)" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="location">Pickup Address / Landmark *</label>
            <input type="text" id="location" name="location" class="form-control" 
                   placeholder="e.g. Grand Hotel Kitchen Gate 3, MG Road" required>
        </div>

        <!-- Interactive Map Location Pin Picker -->
        <div class="form-group">
            <label class="form-label">📍 Pin Location on Map (Click or Drag Marker):</label>
            <div id="location-picker-map" class="picker-map"></div>
            <div style="display: flex; gap: 1rem; margin-top: 0.5rem;">
                <input type="hidden" id="latitude" name="latitude" value="12.9716">
                <input type="hidden" id="longitude" name="longitude" value="77.5946">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="notes">Additional Instructions / Packaging Notes</label>
            <textarea id="notes" name="notes" class="form-control" rows="3" 
                      placeholder="e.g. Packed in food-grade foil trays. Please enter via service alley."></textarea>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn btn-primary" style="flex: 1; padding: 0.8rem;">
                Publish Food Donation
            </button>
            <a href="{{ url_for('donations') }}" class="btn btn-secondary" style="padding: 0.8rem 1.5rem;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
